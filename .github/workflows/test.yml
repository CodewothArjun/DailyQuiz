name: Test Bible Quiz

on:
  workflow_dispatch:

jobs:
  send-quiz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check questions file
        run: |
          echo "===== Current directory ====="
          pwd

          echo "===== Files ====="
          ls -la

          echo "===== questions.py ====="
          cat questions.py

          echo "===== Testing Python import ====="
          python -c "import questions; print('Loaded from:', questions.__file__); print('Has QUESTIONS:', hasattr(questions, 'QUESTIONS')); print('Number of questions:', len(questions.QUESTIONS))"
