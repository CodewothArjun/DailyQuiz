name: Daily Bible Quiz

on:
  schedule:
    - cron: "15 13 * * *"   # 7:00 PM Nepal
    - cron: "45 13 * * *"   # 7:30 PM backup
    - cron: "15 14 * * *"   # 8:00 PM backup
    - cron: "15 16 * * *"   # 10:00 PM backup
    - cron: "15 1 * * *"    # 7:00 AM Nepal
    - cron: "45 1 * * *"    # 7:30 AM backup
    - cron: "15 13 * * *"   # 7:00 PM Nepal
    - cron: "45 13 * * *"   # 7:30 PM backup
    - cron: "15 14 * * *"   # 8:00 PM backup
    - cron: "15 16 * * *"   # 10:00 PM backup
    
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only (do not send, do not advance numbering)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-quiz
  cancel-in-progress: false

jobs:
  send-quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install -r requirements.txt

      - name: Send Bible Quiz
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python quiz.py

      - name: Save progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain progress.json)" ]; then
            git add progress.json
            git commit -m "Update daily quiz progress"
            git pull --rebase
            git push
          else
            echo "No progress changes."
          fi
